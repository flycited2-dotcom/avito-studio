[project]
name = "avito-studio"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  "Pillow>=10.0",
  "openpyxl>=3.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-socket>=0.7",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["avito_studio"]

[tool.coverage.report]
fail_under = 86
show_missing = true
